[package]
name = "nyon-workshop-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Pure deterministic authority, history, and archive core for NYON Workshop"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "=0.10.9"
thiserror = "2.0.16"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { version = "=0.10.9", features = ["asm"] }
