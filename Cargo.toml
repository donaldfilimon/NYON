[workspace]
members = [".", "crates/nyon-workshop-core"]
default-members = ["."]
resolver = "3"
exclude = ["tools/validate-vertex-layout"]

[package]
name = "nyon"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "NYON, a deterministic fictional sector-control game on a custom WebGPU engine"
license = "MIT OR Apache-2.0"

[features]
default = ["native-backends", "webgpu-backend"]
native-backends = ["wgpu/dx12", "wgpu/gles", "wgpu/metal", "wgpu/vulkan"]
webgpu-backend = ["wgpu/webgpu"]
webgl-backend = ["wgpu/webgl"]

[lib]
name = "nyon"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
bytemuck = { version = "1.23.2", features = ["derive"] }
glam = "0.33.6"
log = "0.4.28"
naga = { version = "=30.0.1", features = ["wgsl-in"] }
nyon-workshop-core = { path = "crates/nyon-workshop-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "=0.10.9"
thiserror = "2.0.16"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit = "=0.25.0"
accesskit_winit = "=0.34.0"
env_logger = "0.11.8"
tempfile = "3.21.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
winit = "=0.30.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "=0.1.7"
console_log = "=1.1.0"
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = [
    "CustomEvent",
    "CustomEventInit",
    "DomException",
    "DomStringList",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Node",
    "Storage",
    "Window",
] }
web-time = "=1.1.0"
winit = "=0.30.12"

[dev-dependencies]
pollster = "0.4.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
