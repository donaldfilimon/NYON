[package]
name = "intergalactic-warfare"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A deterministic fictional sector-control game on a custom WebGPU engine"
license = "MIT OR Apache-2.0"

[lib]
name = "intergalactic_warfare"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
bytemuck = { version = "1.23.2", features = ["derive"] }
glam = "0.33.6"
log = "0.4.28"
naga = { version = "=30.0.1", features = ["wgsl-in"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
wgpu = "=30.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"
tempfile = "3.21.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
winit = "=0.30.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "=0.1.7"
console_log = "=1.1.0"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["Storage", "Window"] }
web-time = "=1.1.0"
winit = "=0.30.12"

[dev-dependencies]
pollster = "0.4.0"
sha2 = "=0.10.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
